[package]
name = "auradrop-setup"
version = "0.2.0"
description = "AuraDrop Setup – glass installer for AuraDrop"
authors = ["Umvtt"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "auradrop_setup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
serde_json = "1"
sha2 = "0.10"

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.8"
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_System_Registry"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
