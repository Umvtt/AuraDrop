name: Release

# Builds AuraDrop-Setup.exe on Windows, tests it, and publishes it as a
# GitHub Release when either:
#   - a tag like v0.1.0 is pushed, or
#   - it's run by hand with "publish" ticked (it then creates the tag
#     v<app version> on the commit it built).
# A manual run without "publish" only builds and tests.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release (creates the v<version> tag)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            installer/src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Work out the release tag
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and "v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME doesn't match app version $version"
          }
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Unit tests
        run: |
          npm test
          npm run installer:vite-build
          cargo test --manifest-path installer/src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build installer
        run: npm run installer:build

      # Real Windows installs, an update and an uninstall, using setup's
      # silent mode.
      - name: Smoke test
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist-installer\AuraDrop-Setup-*.exe).FullName
          $dir = "$env:LOCALAPPDATA\AuraDrop"
          $uninstallKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\AuraDrop"
          $assocKey = "HKCU:\Software\Classes\.auradrop"
          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          function Run-Setup($arguments) {
            $p = Start-Process $setup -ArgumentList $arguments -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Setup $arguments failed with exit code $($p.ExitCode)" }
          }
          function Has-Autostart { [bool](Get-ItemProperty $runKey -Name AuraDrop -ErrorAction SilentlyContinue) }

          Run-Setup '--silent'
          if (-not (Test-Path "$dir\auradrop.exe")) { throw "auradrop.exe wasn't installed" }
          if (-not (Test-Path $uninstallKey)) { throw "No Add/Remove Programs entry" }
          if ((Get-ItemProperty $assocKey).'(default)' -ne 'AuraDrop.Design') { throw "No .auradrop association" }
          if (Has-Autostart) { throw "Autostart added without asking" }

          Run-Setup '--silent --no-assoc --autostart'
          if (Test-Path $assocKey) { throw "Association not removed" }
          if (-not (Has-Autostart)) { throw "No autostart entry" }

          # Updating in place must keep those choices.
          Run-Setup '--silent --update'
          if (Test-Path $assocKey) { throw "Update re-added the association" }
          if (-not (Has-Autostart)) { throw "Update removed autostart" }
          if (-not (Test-Path "$dir\auradrop.exe")) { throw "Update lost auradrop.exe" }

          Run-Setup '--silent --uninstall'
          if (Test-Path $dir) { throw "Install folder was left behind" }
          if (Test-Path $uninstallKey) { throw "Add/Remove Programs entry was left behind" }
          if (Has-Autostart) { throw "Autostart entry was left behind" }
          Write-Host "Install, reinstall, update and uninstall OK"

      - uses: actions/upload-artifact@v4
        with:
          name: AuraDrop-Setup
          path: dist-installer/*.exe

      - name: Publish release
        if: github.ref_type == 'tag' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: AuraDrop ${{ steps.version.outputs.tag }}
          make_latest: true
          files: dist-installer/*.exe
          # Also shown on AuraDrop's update screen.
          body_path: RELEASE_NOTES.md
